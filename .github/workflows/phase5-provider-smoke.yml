name: Phase 5 Provider Smoke Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  openai-realtime:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project
        run: python -m pip install --upgrade pip && pip install .
      - name: Verify secret is configured
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::Configure OPENAI_API_KEY in repository Actions secrets before running this workflow."
            exit 2
          fi
      - name: OpenAI Realtime handshake
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/openai_realtime_smoke.py
