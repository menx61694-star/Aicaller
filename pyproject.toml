[project]
name = "aicaller"
version = "0.1.0"
description = "AI-powered incoming-call screening and human takeover service"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic-settings>=2.6,<3",
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.14,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9","httpx>=0.27,<1","ruff>=0.8,<1","pytest-asyncio>=0.24,<1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
